name: Probe sources
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36"
          curl -sSL -m 20 -A "$UA" "https://zeno.fm/api/stations/a9911dff-3db9-41c0-9e65-3c80ba26d17c/" -o /tmp/d
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/d'))
          print("KEYS",list(d))
          def walk(o,p=""):
              if isinstance(o,dict):
                  for k,v in o.items(): walk(v,p+"."+k)
              elif isinstance(o,list):
                  for i,v in enumerate(o[:2]): walk(v,p+f"[{i}]")
              elif any(w in (p+str(o)).lower() for w in ("stream","country","genre","language","url","descr")) and "images.zeno" not in str(o): print(p,"=",str(o)[:120])
          walk(d)
          PY
          curl -sSL -m 20 -A "$UA" "https://zeno.fm/api/stations/?query=tamil&limit=1" | head -c 300; echo
          for q in "limit=2&country=India" "limit=2&query=tamil&languages=Tamil"; do echo "== $q"; curl -sSL -m 20 -A "$UA" "https://zeno.fm/api/stations/?$q" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("total"),[s["title"] for s in d["data"]])'; done
