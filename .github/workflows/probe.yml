name: Probe sources
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36"
          for u in "https://zeno.fm/api/stations/suryan-fm-93-5-chennai/" "https://zeno.fm/api/station/suryan-fm-93-5-chennai/" "https://zeno.fm/api/stations/a9911dff-3db9-41c0-9e65-3c80ba26d17c/"; do echo "== $u"; curl -sSL -m 20 -A "$UA" "$u" | head -c 1500; echo; done
          echo "== radio page"; curl -sSL -m 20 -A "$UA" "https://zeno.fm/radio/suryan-fm-93-5-chennai/" -o /tmp/r; grep -oE '"(streamURL|streamUrl|stream_url|streamName|stream)"[^,]{0,140}' /tmp/r | sort -u | head; grep -oE 'https://stream[^"\\ ]{0,80}' /tmp/r | sort -u | head
          curl -ksSL -m 20 -A "$UA" https://akashvani.gov.in/radio/live.php -o /tmp/a
          python3 - <<'PY'
          import re,html
          t=open('/tmp/a',encoding='utf-8',errors='replace').read()
          ms=list(re.finditer(r'https://air\.pc\.cdn\.bitgravity\.com/air/live/(pbaudio\d+)/playlist\.m3u8',t))
          print("COUNT",len(ms),"UNIQUE",len({m.group(1) for m in ms}))
          for m in ms[:3]: print("CTX",re.sub(r'\s+',' ',t[m.start()-500:m.end()+200]))
          PY
