name: Probe sources
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36"
          curl -sSL -m 20 -A "$UA" "https://zeno.fm/api/stations/?query=suryan&limit=2" | python3 -c '
          import json,sys; d=json.load(sys.stdin)
          print("TOP KEYS", [k for k in d if k!="data"], {k:d[k] for k in d if k!="data"})
          for s in d["data"][:2]:
              print({k:(v if not isinstance(v,dict) else {kk:str(vv)[:80] for kk,vv in v.items()}) for k,v in s.items()})'
          echo "== page 2"; curl -sS -m 20 -A "$UA" -o /dev/null -w "%{http_code}\n" "https://zeno.fm/api/stations/?query=tamil&limit=3&page=2"
          echo "== stream"; curl -sS -m 10 -A "$UA" -r 0-1000 -o /dev/null -D - "https://stream.zeno.fm/$(curl -sS -A "$UA" 'https://zeno.fm/api/stations/?query=tamil&limit=1' | python3 -c 'import json,sys;s=json.load(sys.stdin)["data"][0];print(s.get("streamName") or s.get("slug"))')" | head -12
          for p in https://akashvani.gov.in/radio/live.php https://newsonair.gov.in/live-radio/ https://prasarbharati.gov.in/livestreaming-services/ https://akashvani.gov.in/; do echo "== $p"; curl -ksSL -m 20 -A "$UA" "$p" -o /tmp/a -w "HTTP %{http_code} %{size_download}B\n"; grep -oE 'https?://[^"'"'"' <>]+\.(m3u8|mp3|aac|pls)[^"'"'"' <>]*' /tmp/a | sort -u | head -12; grep -oiE '[^"'"'"' <>]*(stream|live|channel)[^"'"'"' <>]*\.(php|json)[^"'"'"' <>]*' /tmp/a | sort -u | head -10; done
          for id in 001 002 016 ragam; do u="https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio$id/hlspbaudio${id}64kbps.m3u8"; echo "$u $(curl -sS -m 10 -o /dev/null -w %{http_code} $u)"; done
